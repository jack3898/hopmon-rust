name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: hopmon-linux-x86_64
            exe: hopmon
          - name: macOS universal
            os: macos-latest
            artifact: hopmon-macos-universal
            exe: hopmon
          - name: Windows x86_64
            os: windows-latest
            artifact: hopmon-windows-x86_64
            exe: hopmon.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Build universal macOS binary
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output target/release/hopmon \
            target/release/hopmon target/x86_64-apple-darwin/release/hopmon
          lipo -info target/release/hopmon

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/release/${{ matrix.exe }} dist/${{ matrix.artifact }}/
          cp README.md dist/${{ matrix.artifact }}/
          cat > dist/${{ matrix.artifact }}/PUT_GAME_FILES_HERE.txt <<'TXT'
          Copy Hopmon.exe and Music01.mid .. Music04.mid from the original
          freeware release of HOPMON (Saito Games) into this folder, then run
          the hopmon executable. The original game data is not included.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archive
        run: |
          cd dist
          for d in */; do d=${d%/}; zip -r "$d.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
