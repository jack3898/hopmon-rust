[package]
name = "hopmon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform Rust port of Saito Games' freeware 3D arcade game HOPMON"
readme = "README.md"
publish = false

[dependencies]
macroquad = { version = "0.4.16", default-features = false, features = ["audio"] }
midly = "0.5.3"
rustysynth = "1.3.7"
gilrs = { version = "0.11.2", optional = true }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
